# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  # pull_request:
  #   branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '8' ]

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK ${{ matrix.Java }}
      uses: actions/setup-java@v6.1.0
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn -B package --file pom.xml -Dmaven.test.skip=true
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: macrozhao
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build Docker image
      run: docker build --tag yudao-server:${{ github.sha }} --tag macrozhao/ydserver:jdk8 ./yudao-server
    - name: Push Docker image
      run: docker push macrozhao/ydserver:jdk8
      
    - name: Archive JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: yudao-server-jar
        path: yudao-server/target/yudao-server.jar
        if-no-files-found: error
